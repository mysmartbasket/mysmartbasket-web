name: Comprobar build

# Se ejecuta en cada pull request hacia main (incluidos los de Dependabot) para
# detectar roturas antes de fusionar. No despliega nada: el despliegue sigue en
# deploy.yml y solo se lanza al publicar en main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mysmartbasket/package-lock.json

      - name: Install dependencies
        working-directory: mysmartbasket
        run: npm ci

      - name: Build
        working-directory: mysmartbasket
        run: npm run build

      # El build incluye el prerenderizado: si falla en silencio, la landing
      # saldría vacía para Google. Comprobamos que el HTML trae contenido.
      - name: Check the landing is prerendered
        working-directory: mysmartbasket
        run: |
          size=$(wc -c < dist/index.html)
          echo "dist/index.html: ${size} bytes"
          grep -q '<h1' dist/index.html
          [ "$size" -gt 30000 ]

      - name: Check dependencies for known vulnerabilities
        working-directory: mysmartbasket
        run: npm audit --audit-level=high
