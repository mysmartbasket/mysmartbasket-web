  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #009966; --black: #0F172A;
      --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-400: #94a3b8; --slate-500: #64748b;
    }
    body { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; background: #fff; color: var(--black); -webkit-font-smoothing: antialiased; line-height: 1.6; }
    a { color: var(--green); text-decoration: none; }
    nav {
      position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.85); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--slate-100); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .brand-icon { width: 36px; height: 36px; border-radius: 10px; }
    .brand-name { font-weight: 700; font-size: 17px; letter-spacing: -.01em; color: var(--black); }

    main {
      max-width: 560px; margin: 0 auto; padding: 100px 24px 120px; text-align: center;
      display: flex; flex-direction: column; align-items: center;
    }
    .code { font-size: 15px; font-weight: 700; letter-spacing: .1em; color: var(--green); margin-bottom: 20px; }
    .basket { width: 84px; height: 84px; border-radius: 22px; margin-bottom: 28px; }
    h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 700; letter-spacing: -.02em; line-height: 1.25; color: var(--black); margin-bottom: 14px; }
    p.lead { font-size: 16px; color: var(--slate-500); max-width: 420px; margin-bottom: 36px; }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 44px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; padding: 13px 26px; border-radius: 999px; transition: opacity .15s ease; }
    .btn:hover { opacity: .9; text-decoration: none; }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-secondary { background: var(--slate-50); color: var(--black); border: 1px solid var(--slate-100); }

    .links { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; font-size: 14px; color: var(--slate-500); }
    .links a { color: var(--slate-500); font-weight: 600; }
    .links a:hover { color: var(--black); text-decoration: underline; }

    footer { border-top: 1px solid var(--slate-100); padding: 24px; text-align: center; color: var(--slate-400); font-size: 13px; }

    #msb-consent-banner { position: fixed; bottom: 0; left: 0; right: 0; z-index: 70; background: var(--black); color: #fff; padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -10px 30px rgba(0,0,0,.2); }
    @media (min-width: 640px) { #msb-consent-banner { flex-direction: row; align-items: center; } }
    .msb-consent-text { font-size: 13px; color: #cbd5e1; line-height: 1.5; flex: 1; margin: 0; }
    .msb-consent-text a { color: #fff; text-decoration: underline; }
    .msb-consent-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .msb-consent-btn { padding: 8px 16px; font-size: 12px; font-weight: 700; border-radius: 999px; border: none; cursor: pointer; font-family: inherit; }
    .msb-consent-reject { background: #1e293b; color: #fff; }
    .msb-consent-accept { background: var(--green); color: #fff; }
    .msb-consent-btn:hover { opacity: .9; }
  </style>
</head>
<body>

  <nav>
    <a class="brand" href="/">
      <img class="brand-icon" src="/android-chrome-192x192.png" alt="MySmartBasket logo" />
      <span class="brand-name">MySmartBasket</span>
    </a>
  </nav>

  <main>
    <div class="code">ERROR 404</div>
    <img class="basket" src="/android-chrome-192x192.png" alt="MySmartBasket logo" />
    <h1>Esta cesta está vacía</h1>
    <p class="lead">
      La página que buscas no existe o se ha movido. Puede que el enlace esté roto o que la
      dirección tenga un error.
    </p>

    <div class="actions">
      <a class="btn btn-primary" href="/">Volver al inicio</a>
      <a class="btn btn-secondary" href="/blog/">Ver el blog</a>
    </div>

    <div class="links">
      <a href="https://mysmartbasket-app-v2-production.up.railway.app">Entrar a la app</a>
      <a href="/#faq">Preguntas frecuentes</a>
      <a href="mailto:contacto@mysmartbasket.app">Contacto</a>
    </div>
  </main>

  <footer>
    <span>© <span id="year"></span> MySmartBasket. Todos los derechos reservados.</span>
  </footer>

  <script src="/year.js" defer></script>
  <script src="/consent-ads.js" defer></script>
</body>
</html>
