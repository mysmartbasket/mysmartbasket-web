    {

      "@graph": [

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Es gratuito?",
          "acceptedAnswer": { "@type": "Answer", "text": "Tenemos un plan gratuito y un plan Pro por 4,99€/mes con funciones avanzadas. Si te apuntas a la lista de espera, te llevas 1 mes de plan Pro totalmente gratis al lanzamiento." }
        },
        {
          "@type": "Question",
          "name": "¿Cómo obtiene la app los precios?",
          "acceptedAnswer": { "@type": "Answer", "text": "Contamos con un sistema propio que monitoriza precios en Mercadona, Día, Aldi y Alcampo cada 24 horas, y seguimos ampliando la cobertura a más cadenas próximamente. No dependemos de fuentes externas, lo que garantiza mayor fiabilidad." }
        },
        {
          "@type": "Question",
          "name": "¿Cuándo está disponible?",
          "acceptedAnswer": { "@type": "Answer", "text": "Estamos en la fase final de desarrollo, con lanzamiento previsto en las próximas semanas. Iremos dando acceso de forma gradual a quienes estén en la lista de espera, para asegurar una buena experiencia desde el primer día. Apúntate y te notificamos en cuanto tu plaza esté lista." }
        },
        {
          "@type": "Question",
          "name": "¿Está disponible en mi supermercado?",
          "acceptedAnswer": { "@type": "Answer", "text": "Por ahora cubrimos Mercadona, Día, Aldi y Alcampo, y vamos incorporando más cadenas próximamente. Si tu cadena habitual no aparece todavía, puedes solicitarla — la añadimos por orden de demanda." }
        },
        {
          "@type": "Question",
          "name": "¿Puedo compartirlo con mi familia?",
          "acceptedAnswer": { "@type": "Answer", "text": "Sí. Puedes crear un hogar compartido con hasta 5 miembros que comparten la misma cesta, sin duplicados ni necesidad de coordinación adicional. Además, cada uno puede registrar lo que paga para repartir el gasto automáticamente." }
        },
        {
          "@type": "Question",
          "name": "¿Cómo se tratan mis datos personales?",
          "acceptedAnswer": { "@type": "Answer", "text": "Solo almacenamos tu correo electrónico y tus preferencias de compra. No vendemos ni compartimos datos con terceros. Puedes solicitar la eliminación completa de tu cuenta en cualquier momento escribiéndonos a contacto@mysmartbasket.app." }
        }
      ]
    }
